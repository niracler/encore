name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Pages publishing source and custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          domain=$(cat site/CNAME)
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" | jq -e --arg domain "$domain" \
            '.build_type == "workflow" and .cname == $domain' > /dev/null; then
            echo "::error::Check $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/pages: select GitHub Actions and set the custom domain to $domain."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build showcase site
        run: pnpm run build:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
