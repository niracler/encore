<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 284" width="100%">
  <defs>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="36" y="218" width="1128" height="12" rx="6" />
    </clipPath>
  </defs>
  <style>
    .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
    .topbar-bg { fill: #f8fafc; }
    .divider { stroke: #e2e8f0; stroke-width: 1; }
    .brand-pill { fill: #0f172a; }
    .brand-text { fill: #ffffff; font: 700 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.1em; }
    .brand-sub { fill: #64748b; font: 600 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.06em; }
    .agent-pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .agent-text { fill: #334155; font: 600 11.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .word-title { fill: #0f172a; font: 800 34px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.02em; }
    .word-ipa { fill: #fb8f68; font: 600 18px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .pos-pill { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1; }
    .pos-text { fill: #c2410c; font: 600 11.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.03em; }
    .dict-def { fill: #475569; font: 500 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
    .headline { fill: #0f172a; font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
    .ctx-panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .ctx-label { fill: #475569; font: 700 11.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.04em; }
    .ctx-metric { fill: #0f172a; font: 700 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .bar-track { fill: #e2e8f0; }
    .legend-text { fill: #475569; font: 500 12px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
    .shimmer-sweep {
      animation: sweep 3.6s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-360px); }
      100% { transform: translateX(920px); }
    }
    @media (prefers-color-scheme: dark) {
      .card-bg { fill: #0f172a; stroke: #1e293b; }
      .topbar-bg { fill: #1e293b; }
      .divider { stroke: #1e293b; }
      .brand-pill { fill: #f8fafc; }
      .brand-text { fill: #0f172a; }
      .brand-sub { fill: #94a3b8; }
      .agent-pill { fill: #0f172a; stroke: #334155; }
      .agent-text { fill: #e2e8f0; }
      .word-title { fill: #f8fafc; }
      .word-ipa { fill: #fb923c; }
      .pos-pill { fill: #431407; stroke: #7c2d12; }
      .pos-text { fill: #fdba74; }
      .dict-def { fill: #94a3b8; }
      .headline { fill: #f1f5f9; }
      .ctx-panel { fill: #1e293b; stroke: #334155; }
      .ctx-label { fill: #94a3b8; }
      .ctx-metric { fill: #f8fafc; }
      .bar-track { fill: #334155; }
      .legend-text { fill: #cbd5e1; }
    }
  </style>

  <rect x="2" y="2" width="1196" height="280" rx="14" class="card-bg" />
  <path d="M 2 16 Q 2 2 16 2 L 1184 2 Q 1198 2 1198 16 L 1198 48 L 2 48 Z" class="topbar-bg" />
  <line x1="2" y1="48" x2="1198" y2="48" class="divider" />

  <!-- Topbar Left -->
  <rect x="24" y="13" width="78" height="24" rx="6" class="brand-pill" />
  <text x="63" y="29" text-anchor="middle" class="brand-text">ENCORE</text>
  <text x="116" y="29" class="brand-sub">CURTAIN CALL FOR AI AGENTS</text>

  <!-- Topbar Right: Agent Pills -->
  <g transform="translate(792, 13)">
    <rect x="0" y="0" width="68" height="24" rx="6" class="agent-pill" />
    <text x="34" y="16" text-anchor="middle" class="agent-text">Codex</text>

    <rect x="76" y="0" width="104" height="24" rx="6" class="agent-pill" />
    <text x="128" y="16" text-anchor="middle" class="agent-text">Claude Code</text>

    <rect x="188" y="0" width="90" height="24" rx="6" class="agent-pill" />
    <text x="233" y="16" text-anchor="middle" class="agent-text">Claude.ai</text>

    <rect x="286" y="0" width="96" height="24" rx="6" class="agent-pill" />
    <text x="334" y="16" text-anchor="middle" class="agent-text">WorkBuddy</text>
  </g>

  <!-- Dictionary Entry -->
  <text x="36" y="96" class="word-title">en·core</text>
  <text x="182" y="94" class="word-ipa">/ˈɑːŋkɔːr/</text>
  <rect x="318" y="74" width="488" height="26" rx="6" class="pos-pill" />
  <text x="562" y="91" text-anchor="middle" class="pos-text">NOUN &amp; INTERJECTION · FRENCH « ENCORE » ("ONE MORE TIME")</text>

  <text x="36" y="128" class="dict-def">"A demand by an audience for an additional performance at the end of a show."</text>
  <text x="36" y="158" class="headline">Great AI agent runs should not die in a cold .jsonl file. Call them back on stage.</text>

  <!-- Context Bar Panel -->
  <rect x="20" y="178" width="1160" height="90" rx="10" class="ctx-panel" />
  <text x="36" y="203" class="ctx-label">ACTIVE CONTEXT WINDOW · STEP 59 / 133</text>
  <text x="1164" y="203" text-anchor="end" class="ctx-metric">182.3k / 258.4k tokens · 70.6% used</text>

  <!-- 7-Segment Context Bar -->
  <rect x="36" y="218" width="1128" height="12" rx="6" class="bar-track" />
  <g clip-path="url(#barClip)">
    <rect x="36" y="218" width="48" height="12" fill="#6366f1" />
    <rect x="84" y="218" width="35" height="12" fill="#f59e0b" />
    <rect x="119" y="218" width="27" height="12" fill="#22c55e" />
    <rect x="146" y="218" width="8" height="12" fill="#a855f7" />
    <rect x="154" y="218" width="62" height="12" fill="#f97316" />
    <rect x="216" y="218" width="168" height="12" fill="#3b82f6" />
    <rect x="384" y="218" width="448" height="12" fill="#14b8a6" />
    <rect x="36" y="218" width="260" height="12" fill="url(#shimmerGrad)" class="shimmer-sweep" />
  </g>

  <!-- Legends -->
  <g transform="translate(36, 256)">
        <circle cx="5" cy="-4" r="4.5" fill="#6366f1" />
        <text x="15" y="0" class="legend-text">System Prompt ≈11.0k</text>
      </g>
      <g transform="translate(212, 256)">
        <circle cx="5" cy="-4" r="4.5" fill="#f59e0b" />
        <text x="15" y="0" class="legend-text">Tool Schemas ≈8.1k</text>
      </g>
      <g transform="translate(376, 256)">
        <circle cx="5" cy="-4" r="4.5" fill="#22c55e" />
        <text x="15" y="0" class="legend-text">User Prompts ≈6.2k</text>
      </g>
      <g transform="translate(536, 256)">
        <circle cx="5" cy="-4" r="4.5" fill="#a855f7" />
        <text x="15" y="0" class="legend-text">Memory &amp; Rules ≈1.1k</text>
      </g>
      <g transform="translate(704, 256)">
        <circle cx="5" cy="-4" r="4.5" fill="#f97316" />
        <text x="15" y="0" class="legend-text">Skills ≈14.1k</text>
      </g>
      <g transform="translate(818, 256)">
        <circle cx="5" cy="-4" r="4.5" fill="#3b82f6" />
        <text x="15" y="0" class="legend-text">Assistant ≈38.6k</text>
      </g>
      <g transform="translate(962, 256)">
        <circle cx="5" cy="-4" r="4.5" fill="#14b8a6" />
        <text x="15" y="0" class="legend-text">Tool Outputs ≈103.3k</text>
      </g>
</svg>
