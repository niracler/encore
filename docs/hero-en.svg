<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 168" width="100%" role="img" aria-labelledby="title">
  <title id="title">Encore · Replay an AI Agent session to see how it worked and what it delivered.</title>
  <defs>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="0" y="156" width="1200" height="4" rx="2" />
    </clipPath>
  </defs>
  <style>
    .word-title { fill: #0f172a; font: 800 42px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.03em; }
    .word-ipa { fill: #b54708; font: 600 20px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .pos-text { fill: #64748b; font: 600 13.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.04em; }
    .dict-def { fill: #64748b; font: 500 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
    .headline { fill: #0f172a; font: 700 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif; }
    .bar-track { fill: #e2e8f0; }
    .shimmer-sweep {
      animation: sweep 3.6s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-360px); }
      100% { transform: translateX(1260px); }
    }
    @media (prefers-reduced-motion: reduce) { .shimmer-sweep { display: none; } }
    @media (prefers-color-scheme: dark) {
      .word-title { fill: #f8fafc; }
      .word-ipa { fill: #fb923c; }
      .pos-text { fill: #94a3b8; }
      .dict-def { fill: #94a3b8; }
      .headline { fill: #f1f5f9; }
      .bar-track { fill: #1e293b; }
    }
  </style>

  <!-- Dictionary Entry -->
  <text x="4" y="52" class="word-title">en·core</text>
  <text x="188" y="50" class="word-ipa">/ˈɑːŋkɔːr/</text>
  <text x="328" y="48" class="pos-text">NOUN &amp; INTERJECTION · FRENCH « ENCORE » ("ONE MORE TIME")</text>

  <text x="4" y="94" class="dict-def">"A demand by an audience for an additional performance at the end of a show."</text>
  <text x="4" y="130" class="headline">Replay an AI Agent session to see how it worked and what it delivered.</text>

  <!-- Minimal 7-Segment Shimmer Rule -->
  <rect x="0" y="156" width="1200" height="4" rx="2" class="bar-track" />
  <g clip-path="url(#barClip)">
    <rect x="0" y="156" width="64" height="4" fill="#6366f1" />
    <rect x="64" y="156" width="48" height="4" fill="#f59e0b" />
    <rect x="112" y="156" width="36" height="4" fill="#22c55e" />
    <rect x="148" y="156" width="14" height="4" fill="#a855f7" />
    <rect x="162" y="156" width="82" height="4" fill="#f97316" />
    <rect x="244" y="156" width="224" height="4" fill="#3b82f6" />
    <rect x="468" y="156" width="580" height="4" fill="#14b8a6" />
    <rect x="0" y="156" width="320" height="4" fill="url(#shimmerGrad)" class="shimmer-sweep" />
  </g>
</svg>
