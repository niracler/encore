// Read-only projection of Antigravity's gen_metadata.data. Keep native field
// numbers; message history and tool results are intentionally outside this view.
syntax = "proto3";
message CortexStepGeneratorMetadata {
  ChatModelMetadata chat_model = 1;
  repeated int32 step_indices = 2;
}
message ChatModelMetadata {
  string system_prompt = 1;
  repeated ChatToolDefinition tools = 8;
  ChatStartMetadata chat_start_metadata = 9;
  repeated PromptSection prompt_sections = 16;
}
message ChatToolDefinition {
  string name = 1;
  string description = 2;
  string json_schema_string = 3;
}
message PromptSection {
  string title = 1;
  string content = 2;
  int32 token_type = 6;
}
message ChatStartMetadata { ContextWindowMetadata context_window_metadata = 10; }
message ContextWindowMetadata {
  TokenBreakdown token_breakdown = 3;
  int32 max_context_tokens = 4;
}
message TokenBreakdown {
  repeated TopLevelTokenGroup groups = 1;
  int32 total_tokens = 2;
}
message TopLevelTokenGroup {
  string name = 1;
  int32 type = 2;
  int32 source = 3;
  int32 num_tokens = 4;
  repeated TokenGroup children = 5;
}
message TokenGroup {
  string name = 1;
  int32 num_tokens = 3;
}
